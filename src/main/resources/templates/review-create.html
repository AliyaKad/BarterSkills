<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Оставить отзыв - BarterSkills</title>
</head>
<body>

<h1>Оставить отзыв</h1>

<p><a href="/profile">← Назад в профиль</a></p>

<div th:if="${error}" style="color: red;" th:text="${error}"></div>
<div th:if="${success}" style="color: green;" th:text="${success}"></div>

<p>
  <strong>Пользователь:</strong>
  <span th:text="${user.firstName + ' ' + user.lastName}"></span>
</p>

<hr>

<form action="/reviews/create" method="post">
  <!-- ID пользователя, которому оставляем отзыв (скрытое поле) -->
  <input type="hidden" name="userId" th:value="${user.id}">

  <p>
    <label><strong>Оценка (1-5):</strong><br>
      <select name="rating" required>
        <option value="">-- выберите --</option>
        <option value="5">⭐ 5 — Отлично</option>
        <option value="4">⭐ 4 — Хорошо</option>
        <option value="3">⭐ 3 — Нормально</option>
        <option value="2">⭐ 2 — Плохо</option>
        <option value="1">⭐ 1 — Ужасно</option>
      </select>
    </label>
  </p>

  <p>
    <label><strong>Комментарий:</strong><br>
      <textarea name="comment" rows="5" cols="50" placeholder="Расскажите о вашем опыте..." required></textarea>
    </label>
  </p>

  <!-- Опционально: ID сделки (если есть) -->
  <input type="hidden" name="dealId" th:value="${dealId}">

  <button type="submit">Отправить отзыв</button>
</form>

<hr>

<p><a href="/profile">Вернуться в профиль</a></p>

</body>
</html>
