<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Чаты - BarterSkills</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { margin-bottom: 20px; }

        .contact-list { background: white; border-radius: 12px; overflow: hidden; }

        .contact {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
            transition: background 0.2s;
        }

        .contact:hover { background: #f9f9f9; }
        .contact:last-child { border-bottom: none; }

        .avatar {
            width: 48px; height: 48px;
            border-radius: 50%;
            background: #4CAF50;
            color: white;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px;
        }

        .contact-info { flex: 1; }
        .contact-name { font-weight: 500; }
        .contact-preview { font-size: 13px; color: #666; margin-top: 4px; }

        .unread-badge {
            background: #f44336; color: white;
            padding: 2px 8px; border-radius: 10px;
            font-size: 12px; font-weight: bold;
        }

        .back-link { display: inline-block; margin-bottom: 16px; color: #4CAF50; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <a href="/profile" class="back-link">← Назад в профиль</a>
    <h1>Чаты</h1>

    <div th:if="${unreadCount > 0}" style="background: #e8f5e9; padding: 12px; border-radius: 8px; margin-bottom: 16px;">
        🔔 У вас <strong th:text="${unreadCount}">0</strong> непрочитанных сообщений
    </div>

    <div class="contact-list">
        <a th:each="user : ${contacts}"
           th:href="@{/chat/{id}(id=${user.id})}"
           class="contact">
            <div class="avatar" th:text="${#strings.substring(user.firstName, 0, 1)}">A</div>
            <div class="contact-info">
                <div class="contact-name" th:text="${user.firstName} + ' ' + ${user.lastName}">Имя</div>
                <div class="contact-preview">Нажмите, чтобы начать чат</div>
            </div>
        </a>
    </div>

    <div th:if="${#lists.isEmpty(contacts)}" style="text-align: center; padding: 40px; color: #999;">
        <p>Пока нет контактов для чата</p>
        <p style="font-size: 13px; margin-top: 8px;">
            <a href="/requests" style="color: #4CAF50;">Найдите пользователей в заявках</a>
        </p>
    </div>
</div>
</body>
</html>
